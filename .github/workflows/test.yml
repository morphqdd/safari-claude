name: test

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  helper:
    runs-on: macos-15
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - run: swift test
